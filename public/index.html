<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YACardEmu Manager</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">

<style>
body {
    background: #1f0b47;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Aptos, sans-serif;
}

/* ==== レイアウト ==== */

.wrapper {
    text-align: center;
}

.carousel-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
}

/* ==== カルーセル ==== */

#cardControls {
    background: #fff;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}

.carousel-inner {
    width: 350px;
    border-radius: 15px;
    overflow: hidden;
}

.carousel-item img {
    border-radius: 15px;
}

/* ==== Bootstrapの絶対配置を完全無効 ==== */

#previous,
#next {
    position: static !important;
    top: auto !important;
    right: auto !important;
    left: auto !important;
    bottom: auto !important;
    height: auto !important;
}

/* ==== 矢印ボタン ==== */

.arrow-btn {
    font-size: 40px;
    color: white;
    background: black;
    border-radius: 50%;
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    transition: 0.2s;
}

.arrow-btn:hover {
    transform: scale(1.15);
}

/* ==== フォーム ==== */

.form-box {
    background: white;
    padding: 30px;
    margin-top: 40px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}

.btn-lg {
    border-radius: 50px;
}

@media (max-width: 768px) {
    .carousel-inner {
        width: 250px;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="carousel-row">

        <a id="previous"
           class="arrow-btn"
           href="#cardControls"
           role="button"
           data-slide="prev">
           &#10094;
        </a>

        <div id="cardControls"
             class="carousel slide"
             data-interval="false">

            <div class="carousel-inner" id="inner">
            </div>

        </div>

        <a id="next"
           class="arrow-btn"
           href="#cardControls"
           role="button"
           data-slide="next">
           &#10095;
        </a>

    </div>

    <div class="form-box">

        <form action="/api/v1/insertedCard" method="post" class="mb-3">
            <input name="redirect" hidden>
            <button type="submit" name="loadonly" class="btn btn-warning btn-lg btn-block">
                Toggle insert and eject
            </button>
        </form>

        <form action="/api/v1/insertedCard" method="post">
            <input name="redirect" hidden>
            <input id="cardname"
                   class="form-control form-control-lg mb-3"
                   name="cardname"
                   placeholder="card.bin">
            <button type="submit" class="btn btn-primary btn-lg btn-block">
                Choose this card
            </button>
        </form>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"></script>
<script src="blah.js"></script>

</body>
</html>
